# IPIM-T Configuration File - COMPLETE

# Data paths
ENV_DATA: "data/demo/X_env_demo.npy"
INSAR_DATA: "data/demo/X_insar_demo.npy"
LABEL_DATA: "data/demo/y_demo.npy"

# Model parameters - MATCH YOUR DATA SHAPE
INPUT_ENV_DIM: 15
INPUT_INSAR_DIM: 8
HIDDEN_DIM: 256
TRANSFORMER_DIM: 128
TRANSFORMER_HEADS: 8
TRANSFORMER_LAYERS: 6
NUM_HEADS: 8
NUM_LAYERS: 6
DROPOUT_RATE: 0.2
ACTIVATION: "relu"

# Physics-informed parameters
USE_PHYSICS: True
PHYSICS_LAMBDA: 0.1
COHESION_INIT: 20.0
FRICTION_INIT: 30.0            # <-- ADDED: Friction angle (degrees)
DENSITY_INIT: 2000.0
